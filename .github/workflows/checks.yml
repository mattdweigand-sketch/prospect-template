name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r _system/requirements.txt
      - run: python -m unittest discover -s _system/tests
      - run: python _system/scripts/check_repo.py
