# Fictional scaffolding. Setup must replace and review every applicable business choice.
# Dropped orgs are not reported; see the optional ARR query contract.
identity:
  owner_email: seller@example.test
  crm_user_id: example-owner
  timezone: UTC
  internal_domains:
  - example.test
  - example.invalid
approval:
  unattended_writes: false
  readback_required: true
  never:
  - send email
  - create deal
  - change deal stage or amount
crm:
  house_owner_ids: []
  open_deal: lifecycle is open according to the reviewed CRM status mapping
scan:
  quote_min_words: 5
  max_signals_per_account: 3
  warm_engagement:
    task_subject_markers:
    - 'Re:'
    - 'Email: << Re:'
    task_owner: not identity.crm_user_id
    ignored_owner_ids: []
warehouse:
  name: null
  data_date: yesterday in identity.timezone
  forbidden:
  - user names
  - user emails
  - user or seat counts
  - query content
  - activity timing
  enabled: false
  queries:
    adoption_lookup:
      path: null
      sha256: null
    adoption_territory:
      path: null
      sha256: null
    arr_growth_source:
      path: null
      sha256: null
user_scan:
  # Replace these statements and review their generated preview before enabling.
  statements:
    org_adopted: Example Offer is already adopted at the organization.
    individuals_only: People at the organization already pay for Example Offer individually.
  adoption_values:
  - org_adopted
  - individuals_only
  - none_found
  bundle_keys:
    account_name: str
    crm_account_id: str
    account_domain: str
    data_through_date: str
    mapped_org_count: int
    org_subscribed: bool
    org_paying: bool
    org_service_types: list
    org_platforms: list
    paid_individuals_exist: bool
    adoption: str
  enabled: false
prospector:
  max_candidates_per_run: 5
  max_people_per_account: 5
  adoption_source:
    candidate_rows: 20
    signal_type: paid_individuals_present
    enabled: false
  claim_writes:
    claim_new:
    - account create
    - contact create
    claim_transfer:
    - account.owner_id update
    - contact create only when none exists
  account_fields:
  - name
  - website
  - owner_id
  - headcount
  contact_fields:
  - first_name
  - last_name
  - title
  - email
  - account_id
  headcount_sources:
  - company filing or annual report
  - company site or press release
  - configured company-data provider
  contact_email_sources:
  - existing CRM contact
  - 'configured enrichment provider: verified'
outreach:
  bundle_checked_max_age_hours: 24
  suppression_days: 30
  suppressing_task_subtypes:
  - Email
  - Call
  activity_lookback_days: 30
  max_drafts_per_run: 1
  recipient_sources:
  - existing CRM contact with email
  - prior email conversation with the person
  - 'configured enrichment provider: verified'
  - User supplied in this conversation
  talk_track:
    file: talk-track.md
  draft_shape: One verified observation, one supported offer connection, one easy
    question; use the reviewed voice.
  lint:
    enabled: true
    max_body_words: 120
    phrases:
    - excited to share
    - game-changer
    - unlock
    - leverage
    - seamless
  task_status_map:
    Completed: completed
    Not Started: open
    In Progress: open
    Deferred: cancelled
followup:
  due_calendar_days: 7
  arr_growth_due_business_days: 2
  max_tasks_per_run: 1
  task:
    subject: 'Follow up: {email_subject}'
    status: Not Started
    priority: Normal
    subtype: Task
    description: Follow up on signal-outreach email. Sent message {message_id}; thread
      {thread_id}. signal_type {signal_type}; unit {unit}.
  closed_statuses:
  - Completed
  - Deferred
arr_growth:
  window_days: 30
  candidate_rows: 20
  max_accounts_per_run: 2
  territory: .local/config/icp.md frontmatter
  recipient_platform: web
  suppression_days: 30
  # Replace fixed copy and signature; setup previews both greetings before enabling.
  draft:
    subject: Your Example Offer subscription
    greeting_person: Hi {first_name},
    greeting_team: Hi {account_name} team,
    body: 'Thanks for being an Example Offer customer. Would you be open to discussing
      which subscription option fits your team?


      Best,

      Seller

      '
  draft_forbidden_pattern: '[$%]|\bARR\b|\d'
  internal_only:
  - ARR figures
  - billing email source
  - organization uuid
  followup_mode: arr_growth
  enabled: false
schema_version: 1
deployment:
  mode: example
  business_name: Example Company
  product_name: Example Offer
  review_reference: null
email_voice:
  file: voice.md
  source_reference: null
retention:
  setup_sources_permitted: false
  operational_data: temporary_outside_checkout
  approval_record: chat_and_provider
  review_reference: null
